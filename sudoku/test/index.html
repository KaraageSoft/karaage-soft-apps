<!DOCTYPE html>
<!--
  数独のお勉強のテスト台帳（2026-10-18。ユーザーの指示）。作った人が外で、最新版を確かめるためのページ。
  ・どこからもリンクしない。検索にも出さない（noindex）
  ・確認項目は下の ITEMS に書く。機能を足したら書き足す。中身を大きく変えた項目は id を変える（付けた OK/NG を引き継がない）
  ・OK/NG とメモは、開いた端末の中（localStorage）にだけ残る。「メールで送る」で宛先・件名・本文が入ったメールを開く（2026-10-18）。コピーもできる
  ・発表していない機能のことは書かない。このコメントにも名前を書かない（公開のページで、ソースは誰でも読めるので。どれのことかは手元のメモにある）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>数独テスト台帳</title>
<link rel="icon" href="../img/icon.png">
<style>
  :root {
    --bg: #fbf9f3;
    --card: #ffffff;
    --fg: #2c2a24;
    --muted: #6a6555;
    --rule: #ddd8c8;
    --link: #2f6b4f;
    --accent: #2e7d32;
    --accent-fg: #ffffff;
    --chip: #eef0e6;
    --ok: #2e7d32;
    --ok-bg: #e4f2e4;
    --ng: #b3392f;
    --ng-bg: #f8e3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b18; --card: #26251f; --fg: #ece8dd; --muted: #a09a89; --rule: #3a382f; --link: #86c7a4;
      --accent: #4caf50; --accent-fg: #0f1a10; --chip: #302f27; --ok: #7fcf87; --ok-bg: #22361f; --ng: #f08a7f; --ng-bg: #3e2320;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b18; --card: #26251f; --fg: #ece8dd; --muted: #a09a89; --rule: #3a382f; --link: #86c7a4;
    --accent: #4caf50; --accent-fg: #0f1a10; --chip: #302f27; --ok: #7fcf87; --ok-bg: #22361f; --ng: #f08a7f; --ng-bg: #3e2320;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
  }
  .wrap { max-width: 44rem; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-size: 1.4rem; margin: 0; line-height: 1.3; }
  h2 { font-size: .95rem; margin: 0 0 8px; color: var(--muted); }
  a { color: var(--link); }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .build { margin: 0; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .links { display: grid; gap: 8px; }
  .link { display: grid; padding: 10px 12px; border-radius: 10px; text-decoration: none; background: var(--chip); color: var(--fg); }
  .link.primary { background: var(--accent); color: var(--accent-fg); }
  .link b { font-size: 1rem; }
  .link span { font-size: .8rem; opacity: .85; word-break: break-all; }
  .progress { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-size: .9rem; border: 1px solid var(--rule); background: var(--card); color: var(--fg);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 40px;
  }
  button.main { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .group { display: grid; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--rule); border-left-width: 6px; border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .item[data-status="ok"] { border-left-color: var(--ok); }
  .item[data-status="ng"] { border-left-color: var(--ng); }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .title { font-weight: 700; flex: 1 1 14rem; }
  .chip { font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .how { margin: 0; font-size: .92rem; }
  .status button[data-v="ok"][aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .status button[data-v="ng"][aria-pressed="true"] { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 700; }
  .status button[data-v="todo"][aria-pressed="true"] { background: var(--chip); font-weight: 700; }
  .when { font-size: .75rem; color: var(--muted); margin-left: auto; }
  textarea {
    width: 100%; min-height: 2.6rem; resize: vertical; font: inherit; font-size: .92rem; color: var(--fg);
    background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px;
  }
  .empty { border: 1px dashed var(--rule); border-radius: 12px; padding: 18px; color: var(--muted); }
  .small { font-size: .8rem; color: var(--muted); margin: 0; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; background: var(--chip); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  .toast { min-height: 1.4em; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>数独テスト台帳</h1>
    <p class="build" id="build"></p>
    <div class="progress" id="progress"></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="row">
      <button type="button" class="main" id="send">メールで送る</button>
      <button type="button" id="copy">コピー</button>
      <span class="toast" id="toast" role="status"></span>
    </div>
    <p class="small">OK・NG とメモは、この端末の中だけに残ります。「メールで送る」で、宛先と件名が入ったメールが開きます。</p>
  </div>

  <div class="card">
    <h2>開くページ</h2>
    <div class="links">
      <a class="link primary" href="https://karaage-soft-expo-app.expo.app/" target="_blank" rel="noopener"><b>最新のブラウザ版</b><span>karaage-soft-expo-app.expo.app</span></a>
      <a class="link" href="../" target="_blank" rel="noopener"><b>紹介ページ</b><span>karaagesoft.github.io/karaage-soft-apps/sudoku/</span></a>
      <a class="link" href="https://play.google.com/store/apps/details?id=com.karaagesoft.sudoku" target="_blank" rel="noopener"><b>Google Play</b><span>内部テストの版は Play ストアのアプリから</span></a>
    </div>
    <p class="small">ブラウザ版は <code>npx eas-cli deploy --prod</code> で出した最新の版です。</p>
  </div>

  <div class="row filters" role="group" aria-label="絞り込み">
    <button type="button" data-filter="todo">未確認</button>
    <button type="button" data-filter="ng">NG</button>
    <button type="button" data-filter="ok">OK</button>
    <button type="button" data-filter="all">すべて</button>
  </div>
  <div id="list"></div>

  <div class="card">
    <h2>その他</h2>
    <p class="small">上の項目にないことで気づいたこと。送るメールに入ります。</p>
    <textarea id="other" rows="5" aria-label="その他" placeholder="例：〇〇の画面で、△△すると□□になった"></textarea>
  </div>
</div>

<script>
// 確かめる版
const BUILD = { version: '1.0.2（versionCode 20・内部テスト）', commit: '471da52', updated: '2026-11-01' };

// 確認項目。env は device（実機）・web（ブラウザ）・both
const ITEMS = [
  { id: 'als-sets-xz', area: 'ALS-XZ（ほぼロック集合）', env: 'both', title: 'ヒントの文の最初に「①：〇行の〇・〇は〇・〇・〇で、あと一歩で埋まる組です。」「②：…」の2行。光り方は、その組のマスが青・組の数字が緑（大きくならない）・組の並びの囲み',
    how: 'デバッグの ALS の見本などで見る。場合の文は「Ｆ１に4が入らない場合、①のＢ１・Ｆ１から4が抜けて1・9で埋まるので、…」の形になり、場合の段でその組の並びも囲む。' },
  { id: 'als-sets-xy', area: 'ALS-XZ（ほぼロック集合）', env: 'both', title: 'ALS-XY-ウィング（デバッグの問題「ALS-XY-Wing」で4を選ぶ）：最初に①（Ｂ列）・②（２行）・③（Ｄ列）の3行。2本目のつなぎ（5に注目）でも、1本目の２行の囲みが残る。場合の段で①のＢ列・③のＤ列を囲む',
    how: '真ん中の組の文は「②は、抜ける数字が多くても1つなので、2と5の少なくとも片方は②に入ります。」。2つ目の場合で、Ｄ５・Ｄ７の5は赤くならずに、ほかと同じく縮んで消える。' },
  { id: 'als-book-marks', area: 'ALS-XZ（ほぼロック集合）', env: 'both', title: '📖の図の組の印が①②③（丸に数字）になり、本筋の図・ALS-XY-ウィングの図にも付いている。ALS-XY-ウィングの最初の図は２行とＤ列の両方が囲まれている',
    how: '文の「組Ａ・組Ｂ」も「組①・組②・組③」にした。組ごとの図の見出しも「①：１行の組」の形。' },
  { id: 'sdc-sets', area: 'スー・ド・コック', env: 'both', title: 'ヒントの文に「①：５行のＤ５・Ｅ５・Ｆ５・Ｇ５は1〜5で、あと一歩で埋まる組です。」「②：中央ブロックの…」の2行が入る（ブロック側・行側のマスの文のあと）',
    how: '光り方は、①で行の囲みと組の数字の緑、②でブロックの囲みと緑。そのあとは前と同じ（「1と2が入れるのは…」）。' },
];

const ENV_LABEL = { device: '実機', web: 'ブラウザ', both: '実機・ブラウザ' };
const STATUS_LABEL = { todo: '未確認', ok: 'OK', ng: 'NG' };
const KEY = 'sudoku-test-notebook/v1';
const $ = (s) => document.querySelector(s);

// 端末の中の記録 { [id]: { status, note, at } }。読めない端末でも、その場では動く
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
let filter = 'todo';
try { filter = localStorage.getItem(KEY + '/filter') || 'todo'; } catch (e) { /* その場だけ */ }
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* その場だけ */ } };
const rec = (id) => saved[id] || { status: 'todo', note: '' };

$('#build').textContent = [BUILD.version, 'commit ' + BUILD.commit, '更新 ' + BUILD.updated].join(' ・ ');

function fmt(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function renderProgress() {
  const c = { todo: 0, ok: 0, ng: 0 };
  ITEMS.forEach((it) => { c[rec(it.id).status]++; });
  const p = $('#progress'); p.innerHTML = '';
  ['todo', 'ok', 'ng'].forEach((k) => {
    const s = document.createElement('span'); s.textContent = STATUS_LABEL[k] + ' ';
    const b = document.createElement('b'); b.textContent = c[k]; s.appendChild(b); p.appendChild(s);
  });
  const bar = $('#bar'); bar.innerHTML = '';
  [['ok', 'var(--ok)'], ['ng', 'var(--ng)']].forEach(([k, color]) => {
    const i = document.createElement('i'); i.style.width = (c[k] / ITEMS.length * 100) + '%'; i.style.background = color; bar.appendChild(i);
  });
}

function setStatus(id, status) {
  saved[id] = Object.assign({}, rec(id), { status, at: status === 'todo' ? null : Date.now() });
  store(); render();
}

function render() {
  renderProgress();
  document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
  const list = $('#list'); list.innerHTML = '';
  const shown = ITEMS.filter((it) => filter === 'all' || rec(it.id).status === filter);
  if (!shown.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = filter === 'todo' ? '未確認の項目はありません。おつかれさまでした。' : STATUS_LABEL[filter] + 'の項目はありません。';
    list.appendChild(e); return;
  }
  const groups = new Map();
  shown.forEach((it) => { if (!groups.has(it.area)) groups.set(it.area, []); groups.get(it.area).push(it); });
  const box = document.createElement('div'); box.className = 'group';
  groups.forEach((arr, name) => {
    const h = document.createElement('h2'); h.textContent = name + '（' + arr.length + '）'; box.appendChild(h);
    arr.forEach((it) => {
      const r = rec(it.id);
      const card = document.createElement('article'); card.className = 'item'; card.dataset.status = r.status;
      const head = document.createElement('div'); head.className = 'head';
      const t = document.createElement('div'); t.className = 'title'; t.textContent = it.title; head.appendChild(t);
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = ENV_LABEL[it.env]; head.appendChild(c);
      card.appendChild(head);
      // 見るところが無い項目（題名だけで足りるもの）は、段落を出さない
      if (it.how) { const p = document.createElement('p'); p.className = 'how'; p.textContent = it.how; card.appendChild(p); }
      const st = document.createElement('div'); st.className = 'row status';
      ['ok', 'ng', 'todo'].forEach((v) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v; b.textContent = STATUS_LABEL[v];
        b.setAttribute('aria-pressed', String(r.status === v));
        b.addEventListener('click', () => setStatus(it.id, v)); st.appendChild(b);
      });
      if (r.at && r.status !== 'todo') { const w = document.createElement('span'); w.className = 'when'; w.textContent = fmt(r.at); st.appendChild(w); }
      card.appendChild(st);
      const ta = document.createElement('textarea'); ta.placeholder = '気づいたこと（任意）'; ta.value = r.note || '';
      ta.setAttribute('aria-label', it.title + 'のメモ');
      ta.addEventListener('input', () => { saved[it.id] = Object.assign({}, rec(it.id), { note: ta.value }); store(); });
      card.appendChild(ta);
      box.appendChild(card);
    });
  });
  list.appendChild(box);
}

document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.filter;
  try { localStorage.setItem(KEY + '/filter', filter); } catch (e) { /* その場だけ */ }
  render();
}));

// その他（項目にない気づき）。端末の中に残す
let other = '';
try { other = localStorage.getItem(KEY + '/other') || ''; } catch (e) { /* その場だけ */ }
$('#other').value = other;
$('#other').addEventListener('input', (e) => {
  other = e.target.value;
  try { localStorage.setItem(KEY + '/other', other); } catch (err) { /* その場だけ */ }
});

// 結果を文にまとめる。「メールで送る」は宛先・件名・本文が入ったメールを開く（2026-10-18。ユーザーの指示）
function report() {
  const lines = ['数独テスト台帳 ' + BUILD.version + ' / commit ' + BUILD.commit, ''];
  ['ng', 'ok', 'todo'].forEach((k) => {
    const arr = ITEMS.filter((it) => rec(it.id).status === k);
    if (!arr.length) return;
    lines.push('■ ' + STATUS_LABEL[k] + '（' + arr.length + '）');
    arr.forEach((it) => {
      // 1項目1確認にしたので、どの解き方の話かを頭に付ける（2026-10-24）
      lines.push('・【' + it.area + '】' + it.title);
      const note = (rec(it.id).note || '').trim();
      if (note) lines.push('　→ ' + note.replace(/\n/g, '\n　　'));
    });
    lines.push('');
    // その他は NG のすぐあとに
    if (k === 'ng' && other.trim()) lines.push('■ その他', other.trim(), '');
  });
  return lines.join('\n').trim();
}
const toast = (s) => { $('#toast').textContent = s; setTimeout(() => { $('#toast').textContent = ''; }, 2500); };
const MAIL_TO = 'karaagesoft@gmail.com';
$('#send').addEventListener('click', () => {
  const subject = '数独テスト台帳の結果（' + BUILD.version + ' / ' + BUILD.commit + '）';
  location.href = 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(report());
});
$('#copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(report()); toast('コピーしました。'); }
  catch (e) { toast('コピーできませんでした。'); }
});

render();
</script>
</body>
</html>
