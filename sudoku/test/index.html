const ENV_LABEL = { device: '実機', web: 'ブラウザ', both: '実機・ブラウザ' };
const STATUS_LABEL = { todo: '未確認', ok: 'OK', ng: 'NG' };
const KEY = 'sudoku-test-notebook/v1';
const $ = (s) => document.querySelector(s);

// 端末の中の記録 { [id]: { status, note, at } }。読めない端末でも、その場では動く
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
let filter = 'todo';
try { filter = localStorage.getItem(KEY + '/filter') || 'todo'; } catch (e) { /* その場だけ */ }
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* その場だけ */ } };
const rec = (id) => saved[id] || { status: 'todo', note: '' };

$('#build').textContent = [BUILD.version, 'commit ' + BUILD.commit, '更新 ' + BUILD.updated].join(' ・ ');

function fmt(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function renderProgress() {
  const c = { todo: 0, ok: 0, ng: 0 };
  ITEMS.forEach((it) => { c[rec(it.id).status]++; });
  const p = $('#progress'); p.innerHTML = '';
  ['todo', 'ok', 'ng'].forEach((k) => {
    const s = document.createElement('span'); s.textContent = STATUS_LABEL[k] + ' ';
    const b = document.createElement('b'); b.textContent = c[k]; s.appendChild(b); p.appendChild(s);
  });
  const bar = $('#bar'); bar.innerHTML = '';
  [['ok', 'var(--ok)'], ['ng', 'var(--ng)']].forEach(([k, color]) => {
    const i = document.createElement('i'); i.style.width = (c[k] / ITEMS.length * 100) + '%'; i.style.background = color; bar.appendChild(i);
  });
}

function setStatus(id, status) {
  saved[id] = Object.assign({}, rec(id), { status, at: status === 'todo' ? null : Date.now() });
  store(); render();
}

function render() {
  renderProgress();
  document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
  const list = $('#list'); list.innerHTML = '';
  const shown = ITEMS.filter((it) => filter === 'all' || rec(it.id).status === filter);
  if (!shown.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = filter === 'todo' ? '未確認の項目はありません。おつかれさまでした。' : STATUS_LABEL[filter] + 'の項目はありません。';
    list.appendChild(e); return;
  }
  const groups = new Map();
  shown.forEach((it) => { if (!groups.has(it.area)) groups.set(it.area, []); groups.get(it.area).push(it); });
  const box = document.createElement('div'); box.className = 'group';
  groups.forEach((arr, name) => {
    const h = document.createElement('h2'); h.textContent = name + '（' + arr.length + '）'; box.appendChild(h);
    arr.forEach((it) => {
      const r = rec(it.id);
      const card = document.createElement('article'); card.className = 'item'; card.dataset.status = r.status;
      const head = document.createElement('div'); head.className = 'head';
      const t = document.createElement('div'); t.className = 'title'; t.textContent = it.title; head.appendChild(t);
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = ENV_LABEL[it.env]; head.appendChild(c);
      card.appendChild(head);
      // 見るところが無い項目（題名だけで足りるもの）は、段落を出さない
      if (it.how) { const p = document.createElement('p'); p.className = 'how'; p.textContent = it.how; card.appendChild(p); }
      const st = document.createElement('div'); st.className = 'row status';
      ['ok', 'ng', 'todo'].forEach((v) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v; b.textContent = STATUS_LABEL[v];
        b.setAttribute('aria-pressed', String(r.status === v));
        b.addEventListener('click', () => setStatus(it.id, v)); st.appendChild(b);
      });
      if (r.at && r.status !== 'todo') { const w = document.createElement('span'); w.className = 'when'; w.textContent = fmt(r.at); st.appendChild(w); }
      card.appendChild(st);
      const ta = document.createElement('textarea'); ta.placeholder = '気づいたこと（任意）'; ta.value = r.note || '';
      ta.setAttribute('aria-label', it.title + 'のメモ');
      ta.addEventListener('input', () => { saved[it.id] = Object.assign({}, rec(it.id), { note: ta.value }); store(); });
      card.appendChild(ta);
      box.appendChild(card);
    });
  });
  list.appendChild(box);
}

document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.filter;
  try { localStorage.setItem(KEY + '/filter', filter); } catch (e) { /* その場だけ */ }
  render();
}));

// その他（項目にない気づき）。端末の中に残す
let other = '';
try { other = localStorage.getItem(KEY + '/other') || ''; } catch (e) { /* その場だけ */ }
$('#other').value = other;
$('#other').addEventListener('input', (e) => {
  other = e.target.value;
  try { localStorage.setItem(KEY + '/other', other); } catch (err) { /* その場だけ */ }
});

// 結果を文にまとめる。「メールで送る」は宛先・件名・本文が入ったメールを開く（2026-10-18。ユーザーの指示）
function report() {
  const lines = ['数独テスト台帳 ' + BUILD.version + ' / commit ' + BUILD.commit, ''];
  ['ng', 'ok', 'todo'].forEach((k) => {
    const arr = ITEMS.filter((it) => rec(it.id).status === k);
    if (!arr.length) return;
    lines.push('■ ' + STATUS_LABEL[k] + '（' + arr.length + '）');
    arr.forEach((it) => {
      // 1項目1確認にしたので、どの解き方の話かを頭に付ける（2026-10-24）
      lines.push('・【' + it.area + '】' + it.title);
      const note = (rec(it.id).note || '').trim();
      if (note) lines.push('　→ ' + note.replace(/\n/g, '\n　　'));
    });
    lines.push('');
    // その他は NG のすぐあとに
    if (k === 'ng' && other.trim()) lines.push('■ その他', other.trim(), '');
  });
  return lines.join('\n').trim();
}
const toast = (s) => { $('#toast').textContent = s; setTimeout(() => { $('#toast').textContent = ''; }, 2500); };
const MAIL_TO = 'karaagesoft@gmail.com';
$('#send').addEventListener('click', () => {
  const subject = '数独テスト台帳の結果（' + BUILD.version + ' / ' + BUILD.commit + '）';
  location.href = 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(report());
});
$('#copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(report()); toast('コピーしました。'); }
  catch (e) { toast('コピーできませんでした。'); }
});

render();
</script>
